function decodificar(){
  var bin = atob(B64.replace(/\s+/g,""));
  var bytes = new Uint8Array(bin.length);
  for (var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}
var area = document.getElementById("code");
area.value = decodificar();

async function copiar(){
  var msg = document.getElementById("msg");
  area.focus(); area.select();
  try {
    if (navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(area.value);
    } else {
      document.execCommand("copy");
    }
    msg.textContent = "\u2713 Copiado. Ahora pégalo en Wix con Ctrl+V.";
  } catch(e){
    try { document.execCommand("copy"); msg.textContent="\u2713 Copiado (modo alterno). Pégalo con Ctrl+V."; }
    catch(e2){ msg.style.color="#bf5239"; msg.textContent="No se pudo copiar solo. Usa el recuadro de abajo: Ctrl+A y Ctrl+C."; }
  }
}
